[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "my-blog-os"
version = "0.1.0"
edition = "2024"

[dependencies]
ovmf-prebuilt = "0.2.4"

[build-dependencies]
bootloader = { version = "=0.11.12", default-features = false, features = ["uefi"] }
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
